<title>개발 프로젝트 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<!--@css-->

<div class="wrap">
  <header class="top">
    <div class="top-r1">
      <div>
        <h1>개발 프로젝트 보드</h1>
        <p class="sub" id="sub"></p>
      </div>
      <button type="button" class="btn primary" id="add">+ 새 카드</button>
    </div>
    <div class="tools">
      <input class="in" id="q" type="search" placeholder="제목·키·라벨 검색" aria-label="카드 검색">
      <select class="sel" id="fa" aria-label="담당자 필터"></select>
      <select class="sel" id="ft" aria-label="유형 필터"></select>
      <button type="button" class="chip-t" id="fb" aria-pressed="false">막힘만</button>
    </div>
  </header>

  <div id="banner"></div>
  <nav class="stages" id="stages" aria-label="단계 이동"></nav>
  <main class="board" id="board" aria-label="개발 프로젝트 칸반 보드"></main>
  <section class="flow" id="flow" aria-label="흐름 지표"></section>
  <!--@include src/partials/databar.html-->
</div>

<!--@include src/boards/dev/editor.html-->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--@js-->
