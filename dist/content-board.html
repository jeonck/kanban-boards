<title>콘텐츠 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 콘텐츠 보드 색과 글꼴. 공통 CSS가 쓰는 의미 토큰(--danger, --warn, --ok)도 여기서 정한다. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --fg:#16201D; --muted:#5B6863; --line:#D3DCD9;
  --accent:#0E7C66; --accent-fg:#FFFFFF; --accent-soft:#D6EEE7;
  --hi:#B42E2E; --hi-bg:#FBE3E0; --md:#8F5608; --md-bg:#FAEACB; --lo:#25598A; --lo-bg:#DBE9F5;
  --danger:var(--hi); --danger-bg:var(--hi-bg); --warn:var(--md); --ok:var(--muted);
  --bar-imp:#B9D5CC; --shadow:rgba(20,40,34,.10); --scrim:rgba(8,14,12,.5); --sheet-w:480px;
  --lb-s:55%; --lb-bg:90%; --lb-s2:50%; --lb-fg:27%;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#18221F; --surface-2:#121A18; --fg:#E5EEEA; --muted:#92A29C; --line:#293733;
    --accent:#3FC7A5; --accent-fg:#06231C; --accent-soft:#16342C;
    --hi:#FF8F86; --hi-bg:#3C1F1E; --md:#F0B55E; --md-bg:#3A2D14; --lo:#82BBEB; --lo-bg:#162C3F;
    --bar-imp:#2B4A41; --shadow:rgba(0,0,0,.45);
    --lb-s:35%; --lb-bg:22%; --lb-s2:55%; --lb-fg:78%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#18221F; --surface-2:#121A18; --fg:#E5EEEA; --muted:#92A29C; --line:#293733;
  --accent:#3FC7A5; --accent-fg:#06231C; --accent-soft:#16342C;
  --hi:#FF8F86; --hi-bg:#3C1F1E; --md:#F0B55E; --md-bg:#3A2D14; --lo:#82BBEB; --lo-bg:#162C3F;
  --bar-imp:#2B4A41; --shadow:rgba(0,0,0,.45);
  --lb-s:35%; --lb-bg:22%; --lb-s2:55%; --lb-fg:78%;
  color-scheme:dark;
}

/* 공통 기반: 리셋, 헤더, 버튼, 토스트. 색은 보드별 tokens.css가 정의한다. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;display:grid;gap:22px}

/* 헤더 */
.top{display:grid;gap:14px}
.top-r1{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:1.625rem;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 16px}
.sub b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.sub .late,.sub .blk{color:var(--danger);font-weight:600}
.sub .note{color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in,.sel{height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0}
.sel{padding-right:6px}
.in::placeholder{color:var(--muted)}
.tools .in{width:min(220px,100%)}

/* 버튼 */
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--danger-bg);border-color:var(--danger)}

.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:11px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.banner span{min-width:0}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* 열과 카드의 공통 뼈대. 카드 안쪽 모양은 보드별 card.css가 정한다. */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:12px;overflow-x:auto;align-items:stretch;
  scroll-snap-type:x proximity;padding-bottom:6px;overscroll-behavior-x:contain}
body.dragging .board{scroll-snap-type:none}
.col{background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-snap-align:start;transition:background .15s,border-color .15s}
.col.drop-target{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 2px 0 4px}
.col-h h2{margin:0;font-size:14px;font-weight:600}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:20px}
.count.over{color:var(--danger);border-color:var(--danger);background:var(--danger-bg);font-weight:500}
.col-add{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.col-add:hover{background:var(--surface);color:var(--fg)}
.col-b{display:flex;flex-direction:column;gap:8px;flex:1;min-height:110px}
.empty{margin:0;padding:18px 10px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:10px;word-break:keep-all}
.drop-line{height:3px;border-radius:2px;background:var(--accent);flex:none;margin:-3px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px 12px;display:grid;gap:9px;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 2px 10px var(--shadow)}
.card.is-dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;box-shadow:0 16px 36px var(--shadow);cursor:grabbing;transform-origin:24px 18px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.title{margin:0;font-size:14.5px;font-weight:500;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.due{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--danger);font-weight:500}
.due.today{color:var(--warn);font-weight:500}
.due.soon{color:var(--fg)}
.due.done{color:var(--ok)}
.labels{display:flex;flex-wrap:wrap;gap:4px}
.lb{font-size:11.5px;font-weight:500;line-height:18px;padding:0 8px;border-radius:5px;
  background:hsl(var(--h) var(--lb-s) var(--lb-bg));color:hsl(var(--h) var(--lb-s2) var(--lb-fg))}

/* 카드 편집창(모달) 공통 */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(var(--sheet-w,480px),100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:grid;gap:14px;box-shadow:0 24px 60px var(--shadow)}
.sheet h2{margin:0;font-size:1.125rem}
.sheet h2 small{font-family:var(--mono);font-size:.8rem;font-weight:400;color:var(--muted);margin-left:8px}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>span.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.f{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:hsl(var(--h) var(--lb-s) var(--lb-bg));color:hsl(var(--h) var(--lb-s2) var(--lb-fg));border-color:transparent}
.add-lb{display:flex;gap:6px}
.err{margin:0;color:var(--danger);font-size:12.5px;min-height:1em}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.foot .grow{margin-right:auto}

/* 이력 타임라인 */
.hist-now{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.hist li:first-child{border-top:0}
.hist time{font-family:var(--mono);font-size:11.5px;color:var(--muted);grid-row:span 2;padding-top:2px}
.hist em{font-style:normal;font-size:12px;color:var(--muted)}
.hist-empty{margin:0;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12.5px}

/* 데이터 백업 영역 (내보내기·가져오기) */
.databar{display:grid;gap:12px;padding:14px clamp(14px,3vw,24px);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px}
.databar strong{color:var(--fg);margin-right:10px;font-size:14px}
.db-btns{display:flex;flex-wrap:wrap;gap:8px}
.im-box{display:grid;gap:10px;padding:12px 14px;border-radius:10px;background:var(--surface-2);color:var(--fg)}
.im-box p{margin:0}
.im-box .hint{color:var(--muted);font-size:12.5px}

/* 우선순위 필터(세그먼트 컨트롤) */
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;border-radius:7px;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}

/* 콘텐츠 카드: 우선순위 배지(색 + 막대 개수), 노출·클릭 미니 막대 */
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pri{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;line-height:18px}
.lv{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.lv b{width:3px;border-radius:1px;background:currentColor;opacity:.28}
.lv b:nth-child(1){height:4px}.lv b:nth-child(2){height:7px}.lv b:nth-child(3){height:10px}
.pri.high{color:var(--hi);background:var(--hi-bg)}
.pri.mid{color:var(--md);background:var(--md-bg)}
.pri.low{color:var(--lo);background:var(--lo-bg)}
.pri.high .lv b,.pri.mid .lv b:nth-child(-n+2),.pri.low .lv b:nth-child(1){opacity:1}

.m{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.m-bars{display:grid;gap:3px}
.m-bars b{display:block;height:6px;border-radius:0 3px 3px 0;background:var(--bar-imp)}
.m-bars u{display:block;height:4px;min-width:3px;border-radius:0 2px 2px 0;background:var(--accent);text-decoration:none}
.m-n{margin:0;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted)}
.m-n em{font-style:normal;font-family:var(--mono);color:var(--fg)}

/* 편집창: 우선순위 선택 (라디오를 버튼처럼 표시) */
.pri-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pri-pick label{position:relative}
.pri-pick input{position:absolute;opacity:0;inset:0}
.pri-pick span{display:flex;justify-content:center;align-items:center;gap:7px;height:38px;border-radius:9px;border:1px solid var(--line);font-weight:600;font-size:13px}
.pri-pick .high{color:var(--hi)}.pri-pick .mid{color:var(--md)}.pri-pick .low{color:var(--lo)}
.pri-pick .high .lv b,.pri-pick .mid .lv b:nth-child(-n+2),.pri-pick .low .lv b:nth-child(1){opacity:1}
.pri-pick input:checked+span.high{background:var(--hi-bg);border-color:var(--hi)}
.pri-pick input:checked+span.mid{background:var(--md-bg);border-color:var(--md)}
.pri-pick input:checked+span.low{background:var(--lo-bg);border-color:var(--lo)}
.pri-pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* 성과 패널 */
.perf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,3vw,24px) 14px;display:grid;gap:16px}
.perf-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:baseline}
.perf h2{margin:0;font-size:1.0625rem}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.p-sum{display:flex;flex-wrap:wrap;gap:10px 36px}
.p-sum div{display:grid;gap:0}
.p-sum span{color:var(--muted);font-size:12px}
.p-sum strong{font-family:var(--mono);font-weight:500;font-size:1.3rem;line-height:1.3}
.axis,.row{display:grid;grid-template-columns:minmax(0,13rem) 1fr 8.5rem;gap:14px;align-items:center}
.axis-t{display:grid;grid-template-columns:1fr 1fr 1fr;font-family:var(--mono);font-size:11px;color:var(--muted)}
.axis-t span:nth-child(2){text-align:center}.axis-t span:nth-child(3){text-align:right}
.rows{display:grid}
.row{padding:9px 0;border-top:1px solid var(--line)}
.r-t{display:grid;gap:1px;min-width:0}
.r-title{border:0;background:transparent;padding:0;text-align:left;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.r-title:hover{text-decoration:underline}
.r-col{font-size:11.5px;color:var(--muted)}
.bars{display:grid;gap:4px;padding:3px 0;
  background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));
  background-size:1px 100%;background-repeat:no-repeat;background-position:0 0,50% 0,100% 0}
.bar-i{height:10px;border-radius:0 3px 3px 0;background:var(--bar-imp)}
.bar-c{height:6px;min-width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.r-n{font-family:var(--mono);font-size:12px;text-align:right;display:grid;gap:0;color:var(--muted)}
.r-n b{color:var(--fg);font-weight:500;font-size:13px}
.perf-empty{margin:0;color:var(--muted)}

/* 모바일(720px 이하) 공통. 단계 탭, 떠 있는 추가 버튼, 바텀시트 편집창. 보드 CSS 뒤에 로드한다. */
.stages{display:none}
@media (max-width:720px){
  body{padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:16px}
  h1{font-size:1.4rem}
  .sub{font-size:12.5px;gap:2px 12px}
  .tools{width:100%;gap:8px}
  .tools .in{width:100%;flex:1 1 100%}
  .in,.sel,.f{font-size:16px;height:44px}
  .btn{height:44px}
  #add{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;
    height:52px;padding:0 22px;border-radius:26px;font-size:15px;box-shadow:0 8px 22px var(--shadow)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  .stages{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);
    padding:6px 0;margin:-4px 0 -6px;overflow-x:auto;scrollbar-width:none}
  .stages::-webkit-scrollbar{display:none}
  .stages button{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-size:13.5px}
  .stages button span{font-family:var(--mono);font-size:12px}
  .stages button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}

  .board{grid-auto-columns:86%;gap:10px;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
    padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .col-add{width:40px;height:40px;font-size:22px}
  .card{padding:12px 13px 13px}
  .title{font-size:15px}

  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;width:100%;max-height:92dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .chip{height:36px;padding:0 13px;font-size:13.5px}
  .two{gap:10px}
  .foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));
    margin-bottom:calc(-16px - env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
}

/* 콘텐츠 보드 모바일 보정 (공통 mobile.css 뒤에 로드) */
@media (max-width:720px){
  .seg{width:100%}
  .seg button{flex:1;height:38px;padding:0 6px}
  .pri-pick span{height:44px}
  .perf{padding:16px 14px 8px}
  .p-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .axis,.row{grid-template-columns:1fr 6.5rem}
  .axis>:first-child{display:none}
  .r-t{grid-column:1/-1}
  .r-title{padding:4px 0;font-size:14px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-r1">
      <div>
        <h1>콘텐츠 보드</h1>
        <p class="sub" id="sub"></p>
      </div>
      <button type="button" class="btn primary" id="add">+ 새 카드</button>
    </div>
    <div class="tools">
      <input class="in" id="q" type="search" placeholder="카드·라벨 검색" aria-label="카드 또는 라벨 검색">
      <div class="seg" id="pf" role="group" aria-label="우선순위 필터">
        <button type="button" data-p="all" aria-pressed="true">전체</button>
        <button type="button" data-p="high" aria-pressed="false">높음</button>
        <button type="button" data-p="mid" aria-pressed="false">보통</button>
        <button type="button" data-p="low" aria-pressed="false">낮음</button>
      </div>
    </div>
  </header>

  <div id="banner"></div>
  <nav class="stages" id="stages" aria-label="단계 이동"></nav>
  <main class="board" id="board" aria-label="콘텐츠 칸반 보드"></main>
  <section class="perf" id="perf" aria-label="성과"></section>
  <section class="databar" aria-label="데이터 백업">
